<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Symbol für .feldspur-Projektdateien: ein Blatt mit Eselsohr, darauf wie im App-Symbol drei Aufzeichnungen
       auf einer Zeitachse und die Feldmarkierung. Unten die Randmarke aus dem Handbuch als Band. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f1e1c6"/>
    </linearGradient>
    <clipPath id="blatt">
      <path d="M232 64 H 640 L 840 264 V 900 a 60 60 0 0 1 -60 60 H 232 a 60 60 0 0 1 -60 -60 V 124 a 60 60 0 0 1 60 -60 Z"/>
    </clipPath>
  </defs>
  <path d="M232 64 H 640 L 840 264 V 900 a 60 60 0 0 1 -60 60 H 232 a 60 60 0 0 1 -60 -60 V 124 a 60 60 0 0 1 60 -60 Z"
        fill="#6e3218" opacity="0.25" transform="translate(6 14)"/>
  <g clip-path="url(#blatt)">
    <rect x="172" y="64" width="668" height="896" fill="url(#paper)"/>
    <!-- Band unten: Fahne (Terrakotta) und Stab (Umbra) -->
    <rect x="172" y="808" width="668" height="152" fill="#3a281d"/>
    <rect x="172" y="808" width="200" height="152" fill="#a4441f"/>
  </g>
  <!-- Eselsohr -->
  <path d="M640 64 V 214 a 50 50 0 0 0 50 50 H 840 Z" fill="#e3c9a8"/>
  <path d="M640 64 L 840 264" stroke="#c9a77d" stroke-width="6" fill="none"/>
  <!-- drei Aufzeichnungen -->
  <rect x="252" y="380" width="300" height="64" rx="32" fill="#7f8f5a"/>
  <rect x="380" y="494" width="340" height="64" rx="32" fill="#d07a3e"/>
  <rect x="284" y="608" width="232" height="64" rx="32" fill="#a8452c"/>
  <!-- Feldmarkierung -->
  <line x1="476" y1="286" x2="476" y2="730" stroke="#3a281d" stroke-width="28" stroke-linecap="round"/>
  <path d="M476 282 L 636 330 L 476 378 Z" fill="#3a281d" stroke="#3a281d" stroke-width="20" stroke-linejoin="round"/>
</svg>
