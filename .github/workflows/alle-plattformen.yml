name: Alle Plattformen

# Das Label „alle-plattformen“ an einem Pull Request prüft ihn zusätzlich unter Windows und macOS (ci.yml) und baut,
# wenn er die Paketierung ändert, die Installer für alle Plattformen (package.yml).
#
# Eigener Workflow, damit Labels die CI nicht berühren: Jedes Label startet hier einen Lauf, andere Labels als
# „alle-plattformen“ werden übersprungen. Läge das in ci.yml, wäre der übersprungene Lauf dort der neueste, und GitHub
# zeigte am Pull Request den grünen Pflicht-Check „check (ubuntu-latest)“ nicht mehr an (so geschehen an #188).
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Andere Labels bekommen eine eigene Gruppe, damit sie einen laufenden Lauf nicht abbrechen.
  group: alle-plattformen-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  # Welche Teile laufen sollen. Die Pfade entsprechen dem pull_request-Filter in package.yml.
  auswahl:
    if: github.event.label.name == 'alle-plattformen'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      paket: ${{ steps.pfade.outputs.paket }}
    steps:
      - id: pfade
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dateien=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          muster='^(scripts/(fetch-ffmpeg\.mjs|build-ffmpeg-macos\.sh|package-desktop\.mjs|mac-document-type\.mjs)|packaging/.*|LICENSE|LIZENZ|\.github/workflows/package\.yml|apps/desktop/(vite\.config\.ts|package\.json))$'
          if grep -qE "$muster" <<<"$dateien"; then echo "paket=true" >>"$GITHUB_OUTPUT"; else echo "paket=false" >>"$GITHUB_OUTPUT"; fi

  ci:
    needs: auswahl
    uses: ./.github/workflows/ci.yml
    with:
      alle_plattformen: true

  paket:
    needs: auswahl
    if: needs.auswahl.outputs.paket == 'true'
    uses: ./.github/workflows/package.yml
