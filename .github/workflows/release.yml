name: Release

# Neue Version der Feldspur-App veröffentlichen. Start von Hand: Actions → Release → „Run workflow“.
#
#   0. plattformen   Prüfungen und Tests unter Linux, Windows und macOS (ci.yml)
#   1. vorbereiten   prüfen, testen, Changelog aus den Pull Requests erzeugen, Versionen setzen,
#                    Commit „Release vX“ auf main und Tag vX pushen
#   2. pakete        Installer für Windows, macOS (Apple-Chip, Intel) und Linux (package.yml)
#      handbuch      PDF-Handbuch, von Quarto gerendert (handbook.yml)
#   3. veröffentlichen  GitHub-Release mit Installern, Handbuch und SHA256SUMS.txt: Herkunftsnachweise
#                    (Build Attestations) für alle Dateien, erst als Entwurf mit allen Dateien, dann geprüft und
#                    veröffentlicht (die Release ist danach unveränderlich)
#
# Nur die App wird versioniert; packages/* bekommen keine eigenen Tags, Releases oder Changelogs.
# Eine veröffentlichte (nicht als Entwurf angelegte) Release archiviert Zenodo automatisch mit eigener DOI, auch
# eine Vorabversion.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z. B. 0.2.0 oder als Vorabversion 0.2.0-rc.1 (auch -alpha.N, -beta.N)"
        required: true
        type: string
      sichtbarkeit:
        description: "Veröffentlichen oder als Entwurf anlegen? Entwürfe sieht nur, wer Schreibrechte hat; Zenodo archiviert sie nicht."
        type: choice
        default: immer veröffentlichen
        options:
          - immer veröffentlichen
          - immer als Entwurf
      probelauf:
        description: "Probelauf: alles bauen, aber nichts pushen und keine Release anlegen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Pull Requests prüft die CI nur unter Linux; vor jeder Release einmal alle Plattformen.
  plattformen:
    uses: ./.github/workflows/ci.yml
    with:
      alle_plattformen: true

  vorbereiten:
    needs: plattformen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ref: ${{ steps.push.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Hotfix (z. B. v0.2.1, während main schon auf v0.3.0 zugeht): kurzlebiger Branch claude/hotfix-*
      # vom letzten Tag plus Fix; nach dem Release wird er gelöscht, der Tag hält die Commits fest.
      - name: Nur von main oder einem Hotfix-Branch
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/claude/hotfix-') && !inputs.probelauf
        run: |
          echo "::error::Releases entstehen nur von main oder claude/hotfix-* aus (gestartet auf ${GITHUB_REF}). Für Versuche „Probelauf“ wählen."
          exit 1
      - name: Deploy-Schlüssel vorhanden?
        if: ${{ !inputs.probelauf }}
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret RELEASE_DEPLOY_KEY fehlt. Einrichtung: README, Abschnitt „Releases“."
            exit 1
          fi
      # Gepusht wird mit einem Deploy-Schlüssel: Die Regel für main verlangt Statusprüfungen, und nur
      # Deploy-Schlüssel (nicht GITHUB_TOKEN) lassen sich bei einem persönlichen Repository als Ausnahme eintragen.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 22
          cache: true

      - id: version
        name: Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          node scripts/release.ts check "$v"
          {
            echo "version=$v"
            if [[ "$v" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
            echo "previous=$(node scripts/release.ts previous-tag "$v")"
          } >> "$GITHUB_OUTPUT"

      - name: Prüfen und testen
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          vp run check
          vp run test

      - name: Changelog und Versionen
        env:
          V: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          args=(-f tag_name="v$V" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS" ]; then args+=(-f previous_tag_name="$PREVIOUS"); fi
          # Cherry-Picks gehören zu keinem Pull Request: Ein Hotfix bringt seine Notizen als Datei mit.
          if [ -f ".github/release-notes/v$V.md" ]; then
            cp ".github/release-notes/v$V.md" "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
          node scripts/release.ts prepare "$V" "$RUNNER_TEMP/notes.md"
          vp fmt CHANGELOG.md package.json apps/desktop/package.json .zenodo.json README.md
          mkdir -p "$RUNNER_TEMP/text"
          node scripts/release.ts body "$V" "$RUNNER_TEMP/text/release-body.md"
          cp CHANGELOG.md "$RUNNER_TEMP/text/CHANGELOG.md"
          git diff --stat
          cat "$RUNNER_TEMP/text/release-body.md" >> "$GITHUB_STEP_SUMMARY"

      - id: push
        name: Commit und Tag
        env:
          V: ${{ steps.version.outputs.version }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json apps/desktop/package.json CITATION.cff .zenodo.json \
            README.qmd README.md handbuch/_zitieren.qmd
          git commit -m "Release v$V"
          git tag -a "v$V" -m "Feldspur $V"
          if [ "$PROBELAUF" = "true" ]; then
            echo "::notice::Probelauf: Commit und Tag v$V bleiben lokal. Gebaut wird $GITHUB_SHA mit Version $V."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            # Atomar: entweder landen Commit und Tag beide oder keins (z. B. wenn main inzwischen weiter ist).
            git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/v$V"
            echo "ref=v$V" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-text
          path: ${{ runner.temp }}/text/
          # Nur im selben Lauf gebraucht.
          retention-days: 1

  pakete:
    needs: vorbereiten
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.vorbereiten.outputs.ref }}
      version: ${{ needs.vorbereiten.outputs.version }}

  # Haken für das PDF-Handbuch, siehe handbook.yml.
  handbuch:
    needs: vorbereiten
    uses: ./.github/workflows/handbook.yml
    with:
      ref: ${{ needs.vorbereiten.outputs.ref }}
      version: ${{ needs.vorbereiten.outputs.version }}

  veroeffentlichen:
    name: veröffentlichen
    needs: [vorbereiten, pakete, handbuch]
    if: ${{ !inputs.probelauf }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Herkunftsnachweise: OIDC-Token für die Sigstore-Signatur, Nachweis und Speichereintrag bei GitHub ablegen.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: feldspur-*
          merge-multiple: true
          path: assets
      # Muss da sein: An eine veröffentlichte Release lässt sich nichts mehr anhängen.
      - uses: actions/download-artifact@v8
        with:
          name: handbuch
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: release-text
          path: text
      - name: Prüfsummen
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Signierter Herkunftsnachweis (SLSA-Provenienz über Sigstore) für jede Datei der Release. Er entsteht hier in
      # release.yml selbst und nicht in den aufgerufenen package.yml/handbook.yml, damit alle Dateien denselben
      # Signatur-Workflow tragen: Lieferling und `gh attestation verify --signer-workflow` prüfen genau diesen.
      # Vor dem Entwurf, damit an der veröffentlichten Release nichts mehr nachkommt.
      - name: Herkunftsnachweise erzeugen
        uses: actions/attest@v4
        with:
          subject-path: assets/*
      - name: Herkunftsnachweise prüfen
        working-directory: assets
        run: |
          for f in *; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      # Die Release ist unveränderlich (Settings → General → Releases → „Enable release immutability“): Sobald sie
      # veröffentlicht ist, lassen sich Tag und Dateien nicht mehr ändern, ersetzen oder nachreichen. Deshalb erst
      # als Entwurf anlegen, alle Dateien hochladen, gegen SHA256SUMS.txt prüfen und erst dann veröffentlichen.
      - name: Release als Entwurf anlegen und Dateien hochladen
        id: entwurf
        env:
          V: ${{ needs.vorbereiten.outputs.version }}
          PRERELEASE: ${{ needs.vorbereiten.outputs.prerelease }}
        run: |
          # Ein Entwurf aus einem abgebrochenen Lauf („Re-run failed jobs“) ist noch veränderlich und wird ersetzt.
          alt=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$V\") | \"\(.id) \(.draft)\"")
          if [ -n "$alt" ]; then
            read -r alt_id alt_draft <<< "$alt"
            if [ "$alt_draft" != "true" ]; then
              echo "::error::v$V ist schon veröffentlicht und lässt sich nicht mehr ändern. Für Korrekturen eine neue Version ausgeben."
              exit 1
            fi
            echo "::warning::Entwurf v$V aus einem früheren Lauf wird ersetzt."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$alt_id"
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Feldspur $V" \
            --notes-file text/release-body.md \
            "${flags[@]}"
          gh release upload "v$V" assets/* --repo "$GITHUB_REPOSITORY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$V\" and .draft) | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Hochgeladene Dateien prüfen
        working-directory: assets
        env:
          ID: ${{ steps.entwurf.outputs.id }}
        run: |
          # GitHub berechnet für jede hochgeladene Datei selbst eine SHA-256; sie muss zu SHA256SUMS.txt passen,
          # und es dürfen keine Dateien fehlen oder hinzukommen.
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k 2 > "$RUNNER_TEMP/hochgeladen.txt"
          sort -k 2 SHA256SUMS.txt | grep -v '  SHA256SUMS.txt$' > "$RUNNER_TEMP/erwartet.txt"
          if ! diff -u "$RUNNER_TEMP/erwartet.txt" "$RUNNER_TEMP/hochgeladen.txt"; then
            echo "::error::Die Dateien im Entwurf passen nicht zu SHA256SUMS.txt (oben: - erwartet, + hochgeladen). Der Entwurf bleibt unveröffentlicht."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[].name' | grep -qx SHA256SUMS.txt \
            || { echo "::error::SHA256SUMS.txt fehlt im Entwurf."; exit 1; }
          echo "Alle $(wc -l < "$RUNNER_TEMP/erwartet.txt") Dateien und SHA256SUMS.txt sind vollständig hochgeladen."

      - name: Release veröffentlichen
        env:
          V: ${{ needs.vorbereiten.outputs.version }}
          ID: ${{ steps.entwurf.outputs.id }}
          SICHTBARKEIT: ${{ inputs.sichtbarkeit }}
        run: |
          if [ "$SICHTBARKEIT" = "immer als Entwurf" ]; then
            echo "::notice::v$V ist als Entwurf angelegt. Veröffentlichen unter Releases; erst dann archiviert Zenodo sie. Danach lässt sie sich nicht mehr ändern."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false --jq '"\(.html_url) (unveränderlich: \(.immutable // false))"'
          # GitHubs eigene Bestätigung der unveränderlichen Release (Tag und Prüfsummen aller Dateien).
          # Sie entsteht beim Veröffentlichen, deshalb notfalls kurz warten.
          for i in 1 2 3; do
            gh release verify "v$V" --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 10
          done
          echo "::error::gh release verify v$V schlägt fehl. Ist „Release immutability“ noch eingeschaltet?"
          exit 1
