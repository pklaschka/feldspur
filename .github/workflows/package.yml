name: Installationspaket

# Baut die Installer mit mitgelieferter LGPL-Fassung von FFmpeg.
# Läuft von Hand und als Teil des Release-Workflows (release.yml) für alle Plattformen. In Pull Requests, die die
# Paketierung ändern, nur für Linux (mit Rauchtest am fertigen Paket); alle Plattformen mit dem Label
# „💻 alle-plattformen“ (z. B. bei Änderungen an scripts/build-ffmpeg-macos.sh); das Setzen des Labels startet
# alle-plattformen.yml, das diese Datei aufruft, wenn der Pull Request einen der Pfade unten ändert.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit oder Tag, der gebaut wird
        type: string
        default: ""
      version:
        description: Version für Paket und Dateinamen (leer = aus package.json)
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/fetch-ffmpeg.mjs"
      - "scripts/build-ffmpeg-macos.sh"
      - "scripts/package-desktop.mjs"
      - "scripts/mac-document-type.mjs"
      - "packaging/**"
      - "LICENSE"
      - "LIZENZ"
      - ".github/workflows/package.yml"
      - "apps/desktop/vite.config.ts"
      - "apps/desktop/package.json"

env:
  FFMPEG_LINE: "8.1"

# Nur lesen; Artefakte gehen über upload-artifact, nicht über das Repository.
permissions:
  contents: read

# Ein neuer Push bricht den alten Lauf desselben Pull Requests ab (wie in ci.yml, dort steht auch, warum Labels hier
# keinen Lauf auslösen).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('paket-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('paket-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, '💻 alle-plattformen')) && '[{"os": "ubuntu-latest", "name": "linux-x64"}, {"os": "windows-2022", "name": "win32-x64"}, {"os": "macos-latest", "name": "darwin-arm64"}, {"os": "macos-15-intel", "name": "darwin-x64"}]' || '[{"os": "ubuntu-latest", "name": "linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Vite+ bringt Node, pnpm und den Abhängigkeits-Cache mit und führt `vp install` aus.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true

      # FFmpeg (LGPL): Windows/Linux fertig von BtbN, macOS aus den Quellen gebaut (dauert, daher Cache).
      - name: FFmpeg-Cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: apps/desktop/vendor/ffmpeg
          key: ffmpeg-lgpl-${{ matrix.name }}-${{ env.FFMPEG_LINE }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}
      - name: nasm (macOS Intel)
        if: matrix.name == 'darwin-x64'
        run: brew install nasm
      - name: FFmpeg (LGPL) holen oder bauen
        shell: bash
        run: |
          if [ -x "apps/desktop/vendor/ffmpeg/${{ matrix.name }}/ffmpeg" ]; then
            echo "aus dem Cache"; head -n 3 "apps/desktop/vendor/ffmpeg/${{ matrix.name }}/BUILD.txt"
          else
            node scripts/fetch-ffmpeg.mjs
          fi
          # Auch ein ffmpeg aus dem Cache muss alles können, was die App braucht (z. B. PNG für die Einblendungen).
          exe=""; [ "${{ runner.os }}" = "Windows" ] && exe=".exe"
          node scripts/check-ffmpeg.mjs "apps/desktop/vendor/ffmpeg/${{ matrix.name }}/ffmpeg$exe"

      - run: vp run @feldspur/desktop#build
      - run: vp run @feldspur/desktop#native
      - run: node scripts/package-desktop.mjs
        env:
          FELDSPUR_VERSION: ${{ inputs.version }}

      - name: Rauchtest mit dem fertigen Paket (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          cd apps/desktop
          FELDSPUR_E2E_APP="$PWD/release/dist/linux-unpacked/feldspur" xvfb-run -a vpx test/smoke.e2e.ts

      - uses: actions/upload-artifact@v7
        with:
          name: feldspur-${{ matrix.name }}
          path: |
            apps/desktop/release/dist/*.exe
            apps/desktop/release/dist/*.dmg
            apps/desktop/release/dist/*.zip
            apps/desktop/release/dist/*.AppImage
            apps/desktop/release/dist/*.tar.gz
          if-no-files-found: error
          # In einer Release nur bis zum Anhängen im selben Lauf nötig (danach Release-Dateien); Testbauten drei Tage.
          retention-days: ${{ inputs.version != '' && 1 || 3 }}
