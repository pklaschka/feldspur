name: Handbuch

# Schnittstelle für das PDF-Handbuch, das jeder Release beiliegt (aufgerufen von release.yml).
#
# Vertrag:
#   - Quarto rendert das Manuskript in handbuch/ (Webseite und PDF, gesetzt mit dem in Quarto enthaltenen Typst).
#   - Das PDF wird als dist/handbuch/Feldspur-Handbuch-<version>.pdf abgelegt (Version aus dem Aufruf,
#     sonst aus package.json) und landet als Artefakt „handbuch“ in der Release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

jobs:
  handbuch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/quarto
      - name: Handbuch bauen
        run: quarto render handbuch
      - name: PDF mit Version ablegen
        env:
          V: ${{ inputs.version }}
        run: |
          V="${V#v}"
          [ -n "$V" ] || V=$(node -p "require('./package.json').version")
          mkdir -p dist/handbuch
          cp handbuch/_site/Feldspur-Handbuch.pdf "dist/handbuch/Feldspur-Handbuch-$V.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: handbuch
          path: dist/handbuch/*.pdf
          if-no-files-found: error
