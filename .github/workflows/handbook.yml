name: Handbuch

# Schnittstelle für das PDF-Handbuch, das jeder Release beiliegt (aufgerufen von release.yml).
#
# Vertrag:
#   - Quarto rendert das Manuskript in handbuch/ (Webseite und PDF, gesetzt mit dem in Quarto enthaltenen Typst).
#   - Das PDF wird als dist/handbuch/Feldspur-Handbuch-<version>.pdf abgelegt (Version aus dem Aufruf,
#     sonst aus package.json) und landet als Artefakt „handbuch“ in der Release.
#   - Dazu die Druckfassung mit 3 mm Beschnitt rundum (216 × 303 mm, Profil „druck“, siehe
#     handbuch/_quarto-druck.yml) als dist/handbuch/Feldspur-Handbuch-<version>-Druck.pdf.
#   - Dazu das Tastenkürzel-Spickblatt (A4 quer, handbuch/spickblatt/) als
#     dist/handbuch/Feldspur-Tastenkuerzel-<version>.pdf.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

# Nur lesen; Artefakte gehen über upload-artifact, nicht über das Repository.
permissions:
  contents: read

jobs:
  handbuch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/quarto
      - name: Handbuch bauen
        run: quarto render handbuch
      - name: Druckfassung mit Beschnitt bauen
        run: quarto render handbuch --profile druck --to typst
      - name: PDF mit Version ablegen
        env:
          V: ${{ inputs.version }}
        run: |
          V="${V#v}"
          [ -n "$V" ] || V=$(node -p "require('./package.json').version")
          mkdir -p dist/handbuch
          cp handbuch/_site/Feldspur-Handbuch.pdf "dist/handbuch/Feldspur-Handbuch-$V.pdf"
          cp handbuch/_druck/Feldspur-Handbuch-Druck.pdf "dist/handbuch/Feldspur-Handbuch-$V-Druck.pdf"
          cp handbuch/_site/Feldspur-Tastenkuerzel.pdf "dist/handbuch/Feldspur-Tastenkuerzel-$V.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: handbuch
          path: dist/handbuch/*.pdf
          if-no-files-found: error
