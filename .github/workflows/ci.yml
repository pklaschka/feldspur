name: CI

# Sparsam mit Runnern: Pull Requests und main prüft nur Linux. Windows und macOS kommen dazu
#   - mit dem Label „💻 alle-plattformen“ am Pull Request (Setzen des Labels startet alle-plattformen.yml, das diese
#     Datei aufruft; ist das Label gesetzt, prüft auch jeder weitere Push alle Plattformen),
#   - von Hand (Actions → CI → Run workflow),
#   - als Pflichtprüfung in jeder Release (release.yml), bevor Commit und Tag gepusht werden.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      alle_plattformen:
        description: "Auch unter Windows und macOS prüfen"
        type: boolean
        default: true
  workflow_call:
    inputs:
      alle_plattformen:
        type: boolean
        default: true

# Nur lesen; Artefakte gehen über upload-artifact, nicht über das Repository.
permissions:
  contents: read

# Ein neuer Push bricht den alten Lauf desselben Pull Requests ab. Labels lösen hier bewusst keinen Lauf aus: Ein
# übersprungener Lauf wäre der neueste dieses Workflows, und GitHub zeigt am Pull Request dann nur ihn, nicht mehr
# den grünen Pflicht-Check (so geschehen an #188). github.workflow trennt die Gruppe vom Aufruf aus alle-plattformen.yml.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((inputs.alle_plattformen || contains(github.event.pull_request.labels.*.name, '💻 alle-plattformen')) && '["ubuntu-latest", "windows-2022", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Vite+ bringt Node, pnpm und den Abhängigkeits-Cache mit und führt `vp install` aus.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true
      # Linux prüft mit der LGPL-Fassung von ffmpeg/ffprobe, die auch im Installationspaket steckt
      # (scripts/fetch-ffmpeg.mjs, BtbN „latest“): schneller als apt (rund 60 s, hing gelegentlich minutenlang am
      # Ubuntu-Spiegel) und näher an dem, was ausgeliefert wird (OpenH264 statt libx264). Der Cache gilt eine
      # Kalenderwoche; so folgt die CI dem täglichen Bau mit etwas Abstand und lädt nicht bei jedem Lauf 130 MB.
      - name: Kalenderwoche (Linux)
        if: runner.os == 'Linux'
        id: woche
        run: echo "woche=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: FFmpeg-Cache (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/vendor/ffmpeg/linux-x64
          key: ffmpeg-ci-linux-x64-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/check-ffmpeg.mjs') }}-${{ steps.woche.outputs.woche }}
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then node scripts/fetch-ffmpeg.mjs; fi
          head -n 4 apps/desktop/vendor/ffmpeg/linux-x64/BUILD.txt
          echo "$PWD/apps/desktop/vendor/ffmpeg/linux-x64" >> "$GITHUB_PATH"
          # xvfb gehört zum Runner-Image; nur wenn es einmal fehlt, über apt (ohne Empfehlungen und man-db-Lauf).
          if ! command -v xvfb-run > /dev/null; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
          fi
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: vp run check
      - run: vp run test
      - name: Desktop-Rauchtest (Linux)
        if: runner.os == 'Linux'
        run: |
          vp run @feldspur/desktop#native
          xvfb-run -a vp run e2e
